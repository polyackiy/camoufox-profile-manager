# Python dependencies are deliberately absent. Dependabot has no uv ecosystem: its
# "pip" updater would edit pyproject.toml and leave uv.lock stale, and the Docker
# build runs `uv sync --frozen`, which refuses a lock that disagrees with the
# project. A pull request that cannot build is worse than no pull request. Update
# them with `uv lock --upgrade` instead, which refreshes both files together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "build"
    groups:
      # Minor and patch bumps travel together: the web UI has a small, tightly
      # coupled dependency set, and reviewing them separately means several
      # builds proving the same thing.
      #
      # Majors are deliberately left out of the group and arrive one at a time.
      # Grouping everything produced a single pull request carrying Next 15→16,
      # ESLint 9→10 and TypeScript 5→7, which failed CI and could not be split —
      # Next 16 removes `next lint`, so that bump is a migration, not an upgrade.
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
