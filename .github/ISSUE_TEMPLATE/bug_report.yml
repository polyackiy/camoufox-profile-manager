name: Bug report
description: Report a problem with Camoufox Profile Manager
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Start the API with ...
        2. Create a profile with ...
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Project version or commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: desktop-package
    attributes:
      label: Desktop package (if applicable)
      description: For installer or update failures, give the release tag, exact asset name, SHA-256, OS version/build and CPU architecture. Say whether this was a clean install, upgrade or reinstall, and whether WebView2 was already present on Windows.
      placeholder: Desktop acceptance scenario D02; v0.6.0-rc.1; camoufox-pm-macos-arm64.dmg; macOS version; arm64; clean account
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant sanitized log output. Remove passwords, proxy credentials, cookie values and account identifiers. Do not attach private profile archives, databases or encryption keys.
      render: shell
