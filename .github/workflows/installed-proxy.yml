name: Installed desktop proxy acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/installed-proxy.yml'
      - 'scripts/installed_proxy_acceptance.py'
      - 'scripts/installed_sync_acceptance.py'
      - 'tests/support/proxy_protocols.py'
      - 'tests/unit/test_installed_proxy_acceptance.py'
      - 'src/camoufox_pm/core/proxy*.py'
      - 'src/camoufox_pm/core/socks_relay.py'
      - 'src/camoufox_pm/core/browser_session.py'
      - 'src/camoufox_pm/core/workflow*.py'
      - 'src/camoufox_pm/api/routes/workflows.py'
      - 'packaging/camoufox-pm.spec'
      - 'packaging/launch.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
    inputs:
      platform:
        description: Disposable installed desktop platform
        type: choice
        options: [all, ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
        default: all

permissions:
  contents: read

concurrency:
  group: installed-proxy-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Installed proxy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.platform == 'all' || inputs.platform == '') && '["ubuntu-22.04","windows-2022","macos-15","macos-15-intel"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Install locked build and acceptance dependencies
        run: uv sync --locked --extra build --extra dev --extra sync
      - name: Lint acceptance harness and fixtures
        run: uv run --no-sync ruff check scripts/installed_proxy_acceptance.py tests/support/proxy_protocols.py tests/unit/test_installed_proxy_acceptance.py
      - name: Install Linux desktop runtime and isolated-profile NSS tools
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure mirror repeatedly downloaded tiny font packages
          # for minutes. Use Ubuntu's canonical HTTPS archive; keep suites,
          # components, signing keys and APT signature verification unchanged.
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in (Path('/etc/apt/sources.list'), Path('/etc/apt/sources.list.d/ubuntu.sources')):
              if path.is_file():
                  original = path.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  updated = updated.replace('http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu')
                  if updated != original:
                      path.write_text(updated)
          PY
          uv run --no-sync playwright install-deps firefox chromium
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libnss3-tools libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1 libgtk-3-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libx11-xcb1
          uv pip install PyQt6 PyQt6-WebEngine qtpy
      - name: Install isolated-profile NSS tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list nss >/dev/null 2>&1 || brew install nss
          echo "CPM_TEST_NSS_CERTUTIL=$(brew --prefix nss)/bin/certutil" >> "$GITHUB_ENV"
      - name: Install isolated-profile NSS tools (Windows)
        id: nss
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          install: mingw-w64-x86_64-nss
          cache: true
      - name: Select NSS certutil and install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CPM_NSS_ROOT: ${{ steps.nss.outputs.msys2-location }}
        run: |
          $nssTool = Join-Path $env:CPM_NSS_ROOT 'mingw64/bin/certutil.exe'
          if (!(Test-Path $nssTool)) { throw 'NSS certificate utility is missing' }
          "CPM_TEST_NSS_CERTUTIL=$nssTool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          choco install nsis --no-progress -y
      - name: Install the upstream paired browser and resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/install_ci_browser.py
      - name: Record the wrapper/browser pair
        run: uv run --no-sync camoufox version
      - name: Install bundled-UI automation browser
        run: uv run --no-sync playwright install chromium
      - name: Build normal unsigned application and installer
        run: uv run --no-sync python scripts/build_desktop.py --package
      - name: Exercise installed proxy protocols (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a uv run --no-sync python -m scripts.installed_proxy_acceptance --output installed-proxy.json
      - name: Exercise installed proxy protocols
        if: runner.os != 'Linux'
        run: uv run --no-sync python -m scripts.installed_proxy_acceptance --output installed-proxy.json
      - name: Upload sanitized acceptance report only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-proxy-${{ matrix.os }}
          path: installed-proxy.json
          if-no-files-found: warn
