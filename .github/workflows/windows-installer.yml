name: Windows installer safety
on:
  pull_request:
    paths:
      - 'packaging/installer.nsi'
      - 'packaging/webview2.nsh'
      - 'scripts/*windows*'
      - 'scripts/build_desktop.py'
      - 'tests/unit/test_windows_uninstall_manifest.py'
      - 'src/camoufox_pm/desktop.py'
      - 'tests/standalone/test_desktop_lock.py'
      - 'tests/standalone/test_frozen_version.py'
      - 'src/camoufox_pm/__init__.py'
      - 'packaging/build_version.py'
      - 'packaging/camoufox-pm.spec'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-lock:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'uvicorn>=0.30'
      - name: Keep the frozen build version after an in-place upgrade
        run: python -m unittest discover -s tests/standalone -p test_frozen_version.py -v
      - name: Reject competing desktop process and release lock on exit
        run: python -m unittest discover -s tests/standalone -p test_desktop_lock.py -v
        env:
          PYTHONPATH: src
  installer:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: choco install nsis --no-progress -y
      - name: Verify WebView2 detection, failed installation and retry
        run: python scripts/windows_webview2_acceptance.py --output windows-webview2.json
      - name: Compile production installer with synthetic payload
        run: python scripts/build_windows_installer_fixture.py
      - name: Verify reinstall, removal and redirected-path refusal
        run: python scripts/windows_installer_acceptance.py build/installer-fixture/camoufox-pm-fixture.exe --output windows-installer.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installer-safety
          path: |
            windows-installer.json
            windows-webview2.json
