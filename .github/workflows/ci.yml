name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: a PR stacked on another
  # branch got no checks at all, which is when review needs them most.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra chrome-migration --extra updates --extra sync --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests scripts/configure_ci_apt.py
      - name: Format
        run: uv run ruff format --check src tests scripts/configure_ci_apt.py
      - name: Type-check
        run: uv run mypy src/camoufox_pm
      - name: Type-check workflow execution bodies
        run: uv run mypy --check-untyped-defs src/camoufox_pm/core/workflows.py src/camoufox_pm/core/workflow_store.py src/camoufox_pm/core/workflow_models.py src/camoufox_pm/api/routes/workflows.py
      - name: Test
        # Owned SQLite/TCP resources close on failure and cancellation. Catch
        # destructor warnings through pytest's unraisable-exception hook too.
        run: uv run pytest -m "not browser" --cov --cov-report=term-missing -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning -o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test translations
        run: npm test
      - name: Build
        run: npm run build
      - name: Build (static export)
        run: npm run build:static
        env:
          NEXT_EXPORT: "1"
      - name: Verify static export output
        run: test -f out/index.html
      - name: Install uv for UI smoke tests
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install UI smoke test dependencies
        working-directory: .
        run: uv sync --extra dev
      - name: Install Chromium for UI smoke tests
        working-directory: .
        run: |
          sudo python3 scripts/configure_ci_apt.py --root /
          uv run playwright install --with-deps chromium
      - name: Test desktop UI contracts
        working-directory: .
        run: uv run python web/tests/stage_one_ui.py
      - name: Browser download authentication UI contracts
        working-directory: .
        run: uv run python web/tests/browser_download_auth_ui.py
      - name: Proxy protocol guidance and authentication UI contracts
        working-directory: .
        run: uv run python web/tests/proxy_protocol_ui.py

      - name: Russian and Chinese onboarding and workflow contracts
        working-directory: .
        run: uv run python web/tests/localization_ui.py

      - name: Declarative automation workflow UI contracts
        working-directory: .
        run: uv run python web/tests/workflows_ui.py

      - name: Test stage two workflows
        working-directory: .
        run: uv run python web/tests/stage_two_ui.py

      - name: Stage three access UI contracts
        working-directory: .
        run: uv run python web/tests/stage_three_ui.py

      - name: Batch profile operation UI contracts
        working-directory: .
        run: uv run python web/tests/batch_operations_ui.py

      - name: Batch proxy check UI contracts
        working-directory: .
        run: uv run python web/tests/proxy_batch_ui.py

      - name: Template batch creation UI contracts
        working-directory: .
        run: uv run python web/tests/template_batches_ui.py

      - name: Sequential proxy assignment UI contracts
        working-directory: .
        run: uv run python web/tests/proxy_sequence_ui.py

      - name: Synchronization onboarding UI contracts
        working-directory: .
        run: uv run python web/tests/sync_ui.py

      - name: Synchronization profile UI contracts
        working-directory: .
        run: uv run python web/tests/sync_profile_ui.py
