name: Browser compatibility

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        type: choice
        options: [all, ubuntu-latest, windows-latest, macos-latest]
        default: all
      suite:
        description: Full acceptance or focused canvas restart diagnosis
        type: choice
        options: [full, canvas]
        default: full
      raster_mode:
        description: Diagnostic canvas backend override (default tests product behavior)
        type: choice
        options: [default, software, text-probes, gdi-family, cache-lifecycle, process-lifecycle]
        default: default
  pull_request:
    paths:
      - 'src/camoufox_pm/core/**'
      - 'tests/browser/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/browser-compatibility.yml'

concurrency:
  group: browser-compatibility-${{ github.ref }}-${{ inputs.platform || 'all' }}-${{ inputs.suite || 'full' }}-${{ inputs.raster_mode || 'default' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Camoufox (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'ubuntu-latest' && '["ubuntu-latest"]' || inputs.platform == 'windows-latest' && '["windows-latest"]' || inputs.platform == 'macos-latest' && '["macos-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      # Bound a stuck SDK launch/close while allowing multi-launch workflows.
      # Pytest 9.1 emits the current test and thread stacks before exiting.
      PYTEST_ADDOPTS: -vv -o faulthandler_timeout=600 -o faulthandler_exit_on_timeout=true
      CPM_CANVAS_RASTER_MODE: ${{ (inputs.raster_mode == 'text-probes' || inputs.raster_mode == 'cache-lifecycle' || inputs.raster_mode == 'process-lifecycle') && 'default' || inputs.raster_mode || 'default' }}
      CPM_CANVAS_CACHE_PROBE: ${{ inputs.raster_mode == 'cache-lifecycle' && '1' || '0' }}
      CPM_BROWSER_WATCHDOG_SECONDS: '180'
      CPM_CANVAS_DIAGNOSTIC_DIR: canvas-diagnostics
      CPM_BROWSER_TARGET: ${{ inputs.suite == 'canvas' && 'tests/browser/test_fingerprint_stability.py::test_stable_canvas_survives_a_relaunch' || 'tests' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.12
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: |
          uv run playwright install-deps firefox
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 mesa-utils
      - name: Install the upstream paired browser and resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/install_ci_browser.py
      - name: Record the tested pair
        run: uv run camoufox version
      - name: Test real browsers against local synthetic sites (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        # Even headless Firefox needs a display-backed software GL context for
        # the hardware identity assertions, as in upstream Camoufox CI.
        run: xvfb-run -a uv run pytest "$CPM_BROWSER_TARGET" -m browser --no-network --junitxml=browser-results.xml
      - name: Test real browsers against local synthetic sites
        if: runner.os != 'Linux' && (runner.os != 'Windows' || (inputs.raster_mode != 'text-probes' && inputs.raster_mode != 'process-lifecycle'))
        shell: bash
        run: uv run pytest "$CPM_BROWSER_TARGET" -m browser --no-network --junitxml=browser-results.xml
      - name: Verify repeated Windows canvas restarts
        if: runner.os == 'Windows' && inputs.raster_mode != 'text-probes' && inputs.raster_mode != 'process-lifecycle'
        shell: pwsh
        # A single clean run does not settle the previously observed drift.
        run: |
          foreach ($attempt in 1..3) {
            uv run pytest tests/browser/test_fingerprint_stability.py::test_stable_canvas_survives_a_relaunch --no-network --junitxml="browser-canvas-$attempt.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compare independent Windows text rendering probes
        if: runner.os == 'Windows' && inputs.raster_mode == 'text-probes'
        shell: bash
        # Each probe keeps its own fresh persistent profile and the unchanged
        # restart equality assertion. Continue after failures to capture all.
        run: |
          result=0
          for mode in default gdi-classic natural-symmetric; do
            CPM_CANVAS_RASTER_MODE="$mode" CPM_CANVAS_DIAGNOSTIC_DIR="canvas-diagnostics/$mode" \
              uv run pytest tests/browser/test_fingerprint_stability.py::test_stable_canvas_survives_a_relaunch --no-network --junitxml="browser-canvas-$mode.xml" || result=1
          done
          exit "$result"
      - name: Compare new Python processes on the same Windows runner
        if: runner.os == 'Windows' && inputs.raster_mode == 'process-lifecycle'
        shell: bash
        # A fresh pytest/Python process per invocation, on one unchanged VM.
        # Keep the exact assertion and collect the second invocation even when
        # the first fails, distinguishing Python state from machine font state.
        run: |
          result=0
          for process in 1 2; do
            CPM_CANVAS_RASTER_MODE=default CPM_CANVAS_CACHE_PROBE=0 CPM_CANVAS_DIAGNOSTIC_DIR="canvas-diagnostics/process-$process" \
              uv run pytest tests/browser/test_fingerprint_stability.py::test_stable_canvas_survives_a_relaunch --no-network --junitxml="browser-canvas-process-$process.xml" || result=1
          done
          exit "$result"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.os }}
          path: |
            browser-*.xml
            canvas-diagnostics/**
          if-no-files-found: ignore
