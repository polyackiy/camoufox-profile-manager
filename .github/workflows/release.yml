name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Build desktop installers
    uses: ./.github/workflows/desktop.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_draft: true
    secrets: inherit

  build:
    name: Build & attach wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Build the web UI into the package
        run: uv run python scripts/build_webui.py
      - name: Build wheel (from source, includes the bundled UI) and sdist
        run: |
          uv build --wheel
          uv build --sdist
      - name: Checksum Python distributions
        working-directory: dist
        run: |
          for artifact in *.whl *.tar.gz; do sha256sum "$artifact" > "$artifact.sha256"; done
      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI (opt-in)
    needs: build
    runs-on: ubuntu-latest
    # Enable by setting the repository variable PUBLISH_TO_PYPI=true and
    # configuring a Trusted Publisher on PyPI. See docs/releasing.md.
    if: vars.PUBLISH_TO_PYPI == 'true' && !contains(github.ref_name, '-')
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
