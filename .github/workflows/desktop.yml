name: Desktop builds

# Desktop builds are heavy (PyInstaller, ~80 MB zipped each), so they run on
# demand rather than on every release. Trigger from the Actions tab; the built
# apps are uploaded as workflow artifacts. Optionally pass a tag to attach them to
# that GitHub Release.
#
# Code signing is applied automatically when the relevant secrets are configured
# (see docs/signing.md); otherwise the unsigned bundles are produced.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the builds to this existing release tag (optional)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      # Exposed for the `if:` guards below (masked in logs). Empty = skip signing.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra build
      - name: Build desktop app
        run: uv run python scripts/build_desktop.py

      # --- macOS: sign, build a DMG, notarize (only when a certificate is set) ---
      - name: Import macOS certificate
        if: ${{ runner.os == 'macOS' && env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions \
            "$RUNNER_TEMP/build.keychain"
      - name: Sign, build DMG, and notarize (macOS)
        if: ${{ runner.os == 'macOS' && env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          APP="dist/Camoufox Profile Manager.app"
          codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$APP"
          hdiutil create -volname "Camoufox Profile Manager" -srcfolder "$APP" -ov \
            -format UDZO dist/camoufox-pm-macos.dmg
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit dist/camoufox-pm-macos.dmg \
            --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple dist/camoufox-pm-macos.dmg

      # --- Windows: Authenticode-sign the executable (only when a cert is set) ---
      - name: Sign executable (Windows)
        if: ${{ runner.os == 'Windows' && env.WINDOWS_CERT_PFX != '' }}
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist\camoufox-pm\camoufox-pm.exe"

      # --- Package per OS (signed artifacts are picked up automatically) ---
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -ry "camoufox-pm-macos.zip" "Camoufox Profile Manager.app"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/camoufox-pm/* -DestinationPath dist/camoufox-pm-windows.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/camoufox-pm-linux.tar.gz camoufox-pm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-pm-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
