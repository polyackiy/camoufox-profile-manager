name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach to an existing release tag (optional)"
        required: false
        type: string
      upgrade_run:
        description: "Desktop build run ID for a disposable 0.6.0 upgrade trial"
        required: false
        type: string
      upgrade_platform:
        description: "Platforms for the disposable upgrade trial"
        type: choice
        options: [windows-linux, macos-intel]
        default: windows-linux
  workflow_call:
    inputs:
      release_draft:
        required: false
        type: boolean
        default: false
      release_tag:
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    if: inputs.upgrade_run == ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: windows-x86_64, os: windows-2022 }
          - { name: linux-x86_64, os: ubuntu-22.04 }
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Require an existing release for manual attachment
        shell: bash
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra build --extra sync
      - name: Install Linux webview runtime and package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libgbm1 libgtk-3-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libx11-xcb1
          uv pip install PyQt6 PyQt6-WebEngine qtpy
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Build desktop app
        run: uv run --no-sync python scripts/build_desktop.py
      - name: Smoke frozen recovery dispatcher
        run: uv run --no-sync python scripts/smoke_desktop_recovery.py

      - name: Import macOS certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$RUNNER_TEMP/build.keychain"
      - name: Sign macOS app
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "dist/Camoufox Profile Manager.app"
      - name: Import Windows certificate and sign app
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $cert = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f $cert /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\camoufox-pm\camoufox-pm.exe"
          if ($LASTEXITCODE -ne 0) { throw "App signing failed" }
      - name: Create installer (also for unsigned builds)
        run: uv run --no-sync python scripts/build_desktop.py --package-only
      - name: Notarize and staple macOS installer
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != '' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit dist/*.dmg --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple dist/*.dmg
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          $installer = (Get-ChildItem "dist\*-setup.exe").FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $installer
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
      - name: Verify Windows installer data preservation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "dist\*-setup.exe").FullName
          uv run --no-sync python scripts/windows_installer_acceptance.py $installer --output windows-installer.json
          if ($LASTEXITCODE -ne 0) { throw "Installer acceptance failed" }
      - name: Upload Windows installer acceptance result
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-acceptance
          path: windows-installer.json
      - name: Verify Linux package on clean Ubuntu systems
        if: runner.os == 'Linux'
        run: |
          mkdir -p linux-package-reports
          for version in 22.04 24.04; do
            docker run --rm --env CPM_DISPOSABLE_PACKAGE_TEST=1 \
              --mount type=bind,src="$PWD/dist",dst=/packages,readonly \
              --mount type=bind,src="$PWD/scripts",dst=/tests,readonly \
              --mount type=bind,src="$PWD/linux-package-reports",dst=/reports \
              "ubuntu:$version" bash /tests/linux_package_acceptance.sh \
              /packages/camoufox-pm-linux-x86_64.deb "/reports/ubuntu-$version.json"
          done
      - name: Upload Linux package acceptance results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-package-acceptance
          path: linux-package-reports/*.json
      - name: Refresh installer checksums
        run: uv run --no-sync python scripts/build_desktop.py --checksums-only
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: camoufox-pm-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
      - name: Attach installers to release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          draft: ${{ inputs.release_draft || false }}
          prerelease: ${{ contains(inputs.release_tag, '-') }}
          make_latest: ${{ contains(inputs.release_tag, '-') && 'false' || 'legacy' }}
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.deb
            dist/*.tar.gz
            dist/*.sha256
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pfx" "$RUNNER_TEMP/key.p8"
          if [ "$RUNNER_OS" = "macOS" ] && [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain"
          fi

  upgrade:
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_run != ''
    name: Upgrade (${{ matrix.name }})
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.upgrade_platform == 'macos-intel'
          && '[{"name":"macos-x86_64","os":"macos-15-intel","package":"camoufox-pm-macos-x86_64.dmg"}]'
          || '[{"name":"windows-x86_64","os":"windows-2022","package":"camoufox-pm-windows-x86_64-setup.exe"},{"name":"linux-x86_64","os":"ubuntu-22.04","package":"camoufox-pm-linux-x86_64.deb"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra sync
      - name: Install Linux browser and window lifecycle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo python3 scripts/configure_ci_apt.py --root /
          uv run --no-sync playwright install-deps chromium firefox
          sudo apt-get install -y xvfb openbox wmctrl
      - name: Install UI automation browser
        run: uv run --no-sync playwright install chromium
      - name: Provision the unchanged upstream browser pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-sync python scripts/install_ci_browser.py
      - name: Download published 0.6.0 and the exact candidate from Desktop builds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CPM_UPGRADE_RUN: ${{ inputs.upgrade_run }}
          CPM_PACKAGE: ${{ matrix.package }}
          CPM_ARTIFACT: camoufox-pm-${{ matrix.name }}
        run: |
          [[ $CPM_UPGRADE_RUN == 42216747404 ]]
          test "$(gh run view "$CPM_UPGRADE_RUN" --json headSha,event,conclusion --jq '[.headSha,.event,.conclusion] | join(":")')" = "c958070e11d403b359416acf1840db54d1de2daf:workflow_dispatch:success"
          gh release download v0.6.0 --pattern "$CPM_PACKAGE*" --dir previous
          gh run download "$CPM_UPGRADE_RUN" --name "$CPM_ARTIFACT" --dir candidate
      - name: Exercise real upgrade and offline fixture rollback (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          CPM_PACKAGE: ${{ matrix.package }}
        run: |
          xvfb-run -a bash -c 'openbox >/dev/null 2>&1 & exec uv run --no-sync python -m scripts.installed_upgrade_trial "previous/$CPM_PACKAGE" "candidate/$CPM_PACKAGE" --output installed-upgrade.json'
      - name: Exercise real upgrade and offline fixture rollback
        if: runner.os != 'Linux'
        shell: bash
        env:
          CPM_PACKAGE: ${{ matrix.package }}
        run: uv run --no-sync python -m scripts.installed_upgrade_trial "previous/$CPM_PACKAGE" "candidate/$CPM_PACKAGE" --output installed-upgrade.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-upgrade-${{ matrix.name }}
          path: installed-upgrade.json
          if-no-files-found: warn
