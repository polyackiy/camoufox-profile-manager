# Example Chrome -> Camoufox migration configuration.
# Defines mapping strategies and migration settings. All values are examples.

# How Chrome profiles map onto Camoufox profiles.
mapping_strategies:
  # Default for unrecognized profiles.
  default:
    type: "create_new"
    group: "chrome_imports"
    name_template: "Chrome - {display_name}"

  # Explicit mappings for specific Chrome profiles.
  configured:
    "Default":
      type: "create_new"
      group: "chrome_imports"
      name_template: "Personal - {display_name}"

  # Pattern-based mapping by profile name.
  pattern_matching:
    "Work*":
      type: "create_new"
      group: "work_profiles"
      name_template: "Work - {display_name}"
    "*Test*":
      type: "create_new"
      group: "test_profiles"
      name_template: "Test - {display_name}"

# Default migration settings.
migration_settings:
  include_cookies: true
  include_bookmarks: true
  include_history: false

  security:
    # Maximum number of profiles in a single bulk migration.
    max_bulk_profiles: 50
    # Create backups before migrating.
    create_backups: false
    # Data types that are never migrated.
    exclude_data:
      - "passwords"
      - "payment_methods"

  performance:
    # Pause between profile migrations (seconds).
    delay_between_migrations: 1
    # Maximum cookie-file size to migrate (MB).
    max_cookies_file_size: 100

# Defaults for the Camoufox profiles created during migration.
camoufox_profile_defaults:
  browser_settings:
    os: "windows"
    screen: "1920x1080"
    languages: ["en-US", "en"]
    timezone: "America/New_York"
    window_width: 1280
    window_height: 720
    webrtc_mode: "replace"
    canvas_noise: true
    webgl_noise: true
    audio_noise: true

  groups:
    chrome_imports:
      description: "Imported Chrome profiles"
      color: "#4285f4"
    work_profiles:
      description: "Work profiles"
      color: "#ea4335"
    test_profiles:
      description: "Test profiles"
      color: "#9aa0a6"

logging:
  level: "INFO"
  save_migration_logs: true
  log_file: "chrome_migration.log"

# Data paths (auto-detected; override if needed).
paths:
  chrome_data_path: ""
  camoufox_profiles_path: "data/profiles"
  temp_path: "/tmp/chrome_migration"

# Experimental features.
experimental:
  migrate_extensions: false
  migrate_settings: false
