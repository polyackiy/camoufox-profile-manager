# Example Chrome -> Camoufox migration mapping.
#
# Generate a real one from your own Chrome profiles with:
#   python -m extras.chrome_migration.wizard
# then edit it and pass it to the migration manager. All values below are
# synthetic examples.

# Path to your Chrome "User Data" directory. null = auto-detect for your OS.
chrome_data_path: null

# For reference only: Camoufox profiles that already exist, so you can map a
# Chrome profile onto one of them instead of creating a new profile.
existing_camoufox_profiles:
  - id: exampleid1
    name: Example Profile A
    group: default
    status: active
  - id: exampleid2
    name: Example Profile B
    group: default
    status: active

# One entry per Chrome profile you want to migrate.
profile_mapping:
  # Option 1 — create a new Camoufox profile:
  - chrome_profile: Default
    chrome_display_name: Personal
    chrome_path: /path/to/Chrome/User Data/Default
    create_new_profile: true
    new_profile_name: Chrome - Personal
    new_profile_group: chrome_imports
    camoufox_profile_id: null
    migration_settings:
      include_cookies: true
      include_bookmarks: true
      include_history: false

  # Option 2 — migrate into an existing Camoufox profile (set its id):
  - chrome_profile: Profile 1
    chrome_display_name: Work
    chrome_path: /path/to/Chrome/User Data/Profile 1
    create_new_profile: false
    camoufox_profile_id: exampleid2
    migration_settings:
      include_cookies: true
      include_bookmarks: true
      include_history: false
